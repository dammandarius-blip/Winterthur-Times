<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Winterthur Times</title>
    <!-- Tailwind CSS laden -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons laden -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase (für gemeinsame Daten: Users/Chats/Artikel) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
        <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body class="bg-[#fcfbf9] text-gray-900 min-h-screen relative">
    <!-- Hier wird die gesamte App hineingeladen -->
    <div id="app"></div>

    <!-- Worker-Chat UI (benötigte IDs) -->
    <div class="max-w-3xl mx-auto px-4 pb-10 font-sans">
        <div class="bg-white border border-gray-200 shadow-sm rounded-sm p-4">
            <h3 class="text-lg font-black uppercase mb-3">Chat</h3>
            <div id="chat" class="h-64 overflow-y-auto bg-gray-50 border border-gray-200 rounded p-3 mb-3"></div>
            <div class="flex gap-2">
                <input id="chatInput" type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" placeholder="Nachricht..." />
                <button id="sendBtn" class="bg-blue-900 text-white font-bold px-4 py-2 rounded hover:bg-blue-800 transition-colors">Senden</button>
            </div>
        </div>
    </div>

        <script src="./assets/js/app.js"></script>
        <script src="./assets/js/script.js"></script>


</body>
</html>
