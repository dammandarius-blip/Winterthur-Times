name: Auto Article Generator

on:
  schedule:
    - cron: "0 7 * * *"   # Jeden Tag um 07:00 Uhr
  workflow_dispatch:       # Manuelles Starten möglich

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run article generator
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python3 generate_article.py

      - name: Commit and push changes
        run: |
          git config user.name "AutoBot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Automatischer Artikel $(date '+%Y-%m-%d')" || echo "Nichts zu committen"
          git push
