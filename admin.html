<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Winterthur Times – Redaktion</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; }
    textarea { width: 100%; height: 200px; }
    input, button { padding: 8px; margin: 5px 0; }
    .preview { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Redaktion – Artikelgenerator</h1>

  <label>Thema / Stichworte:</label><br>
  <input id="topic" type="text" placeholder="z.B. Klimapolitik Schweiz"><br>

  <button id="generate">Artikel generieren</button>

  <div id="status"></div>

  <h2>Vorschau</h2>
  <div class="preview">
    <h3 id="preview-title"></h3>
    <p id="preview-text"></p>
  </div>

  <button id="publish" disabled>Veröffentlichen</button>

  <script>
    const WORKER_BASE = "https://askai.mikestaub705.workers.dev/"; // hier deine Worker-URL eintragen

    let currentArticle = { title: "", text: "" };

    document.getElementById("generate").addEventListener("click", async () => {
      const topic = document.getElementById("topic").value.trim();
      if (!topic) {
        alert("Bitte ein Thema eingeben.");
        return;
      }
      document.getElementById("status").textContent = "Generiere Artikel...";
      document.getElementById("publish").disabled = true;

      const res = await fetch(WORKER_BASE + "/generate-article", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic })
      });

      const data = await res.json();
      if (data.error) {
        document.getElementById("status").textContent = "Fehler: " + data.error;
        return;
      }

      currentArticle = { title: data.title, text: data.text };
      document.getElementById("preview-title").textContent = data.title;
      document.getElementById("preview-text").textContent = data.text;
      document.getElementById("status").textContent = "Artikelvorschlag erstellt. Prüfe ihn und klicke auf Veröffentlichen.";
      document.getElementById("publish").disabled = false;
    });

    document.getElementById("publish").addEventListener("click", async () => {
      if (!currentArticle.title || !currentArticle.text) {
        alert("Kein Artikel zum Veröffentlichen.");
        return;
      }
      document.getElementById("status").textContent = "Veröffentliche Artikel auf GitHub...";

      const res = await fetch(WORKER_BASE + "/publish-article", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentArticle)
      });

      const data = await res.json();
      if (data.error) {
        document.getElementById("status").textContent = "Fehler: " + data.error;
        return;
      }

      document.getElementById("status").textContent = "Artikel veröffentlicht als: " + data.filename;
      document.getElementById("publish").disabled = true;
    });
  </script>
</body>
</html>
