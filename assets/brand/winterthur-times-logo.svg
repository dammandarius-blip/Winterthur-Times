<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Winterthur Times Logo</title>
  <desc id="desc">A modern newspaper globe mark for Winterthur Times.</desc>
  <defs>
    <radialGradient id="paper" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#d9e1ec"/>
    </radialGradient>
    <linearGradient id="ink" x1="18" y1="20" x2="142" y2="142">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="80" cy="80" r="66" fill="url(#paper)" stroke="#111827" stroke-width="3" filter="url(#shadow)"/>
  <path d="M23 80h114M80 14c17 17 25 39 25 66s-8 49-25 66M80 14C63 31 55 53 55 80s8 49 25 66" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M33 48c28 11 66 11 94 0M33 112c28-11 66-11 94 0" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M30 96c31 8 69 8 100 0M30 64c31-8 69-8 100 0" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
  <g transform="rotate(-17 80 80)">
    <rect x="20" y="64" width="120" height="32" rx="3" fill="url(#ink)"/>
    <text x="80" y="86" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">WT</text>
  </g>
  <text x="80" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#111827">WINTERTHUR TIMES</text>
</svg>
